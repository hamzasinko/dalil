[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dalil"
dynamic = ["version"]
description = "Decorate a function to get a flowchart, a line-by-line execution trace, a complexity estimate, an HTML report and a LaTeX export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Hamza Fikri" },
    { name = "Zakariae Elbouzidi" },
    { name = "Hayat Lotfi" },
    { name = "Ali Essarsare" },
]
keywords = ["tracing", "flowchart", "complexity", "latex", "education"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
viz = ["graphviz"]
cli = ["rich"]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
    "build",
    "twine",
]
docs = ["mkdocs-material"]

[project.urls]
Homepage = "https://github.com/dalil-python/dalil"
Documentation = "https://dalil-python.github.io/dalil/"
Repository = "https://github.com/dalil-python/dalil"
Issues = "https://github.com/dalil-python/dalil/issues"
Changelog = "https://github.com/dalil-python/dalil/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dalil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dalil"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]
"examples/**" = ["D100"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dalil --cov-report=term-missing --cov-fail-under=90 -ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["dalil"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "@abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
