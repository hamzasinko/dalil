name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    # Base branches of the PR; feature/** branches are covered when
    # their PR targets one of these bases (or a feature base).
    branches: [main, dev, prod, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy --strict src tests

  tests:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  test:
    name: test
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the full matrix result
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Test matrix failed: ${{ needs.tests.result }}"
            exit 1
          fi

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
